rules:
  # 局域网与本机流量直接放行
  - GEOIP,lan,DIRECT,no-resolve

  # 常见国内 DNS / NTP 等服务直连
  - DST-PORT,123,DIRECT
  - DST-PORT,53,DIRECT

  # 国内常用域名及主流平台直连 (利用 Mihomo 内置规则集合)
  - GEOSITE,cn,DIRECT
  - GEOSITE,category-games@cn,DIRECT

  # 国内 IP 段直连
  - GEOIP,CN,DIRECT

  # 其余全部走 WARP 节点选择器
  - MATCH,🚀 节点选择