name: Auto Generate WARP Config

on:
  schedule:
    # 每天 UTC 时间 00:00 与 12:00 自动运行 (北京时间 08:00 与 20:00)
    - cron: '0 0,12 * * *'
  workflow_dispatch: # 支持手动点击一键运行

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 运行环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 下载并安装 warpscout
        run: |
          curl -fsSL https://raw.githubusercontent.com/vernette/warpscout/master/install.sh | sh
          warpscout version

      - name: 注册 Cloudflare WARP 凭据
        run: |
          warpscout register

      - name: 扫描 MASQUE-H2 端点 (宽度采样)
        run: |
          # 提高单子网采样数到 25，使用 visa.cn 确保探测通畅
          warpscout scan -p masque-h2 -masque-sni www.visa.cn -n 25 \
            -o scan-report.txt \
            -conf best-mihomo.yaml \
            -conf-type mihomo

      - name: 执行增强解析与多策略组装 (同级目录输出)
        run: |
          python generate_sub.py

      - name: 提交并推送到当前仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 只将最终的 warp.yaml 提交推送到仓库
          git add warp.yaml
          
          if git diff --staged --quiet; then
            echo "配置无变化，无需推送。"
          else
            git commit -m "Auto update warp.yaml with advanced routing and multi-SNI [skip ci]"
            git push
          fi
