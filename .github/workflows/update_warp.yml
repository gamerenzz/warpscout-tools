name: Auto Generate WARP Config

on:
  schedule:
    # 每 12 小时自动运行一次 (UTC 时间 0点和12点)
    - cron: '0 0,12 * * *'
  workflow_dispatch: # 支持手动点击按钮随时运行

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 安装 warpscout
        run: |
          # 使用官方安装脚本自动拉取最新的 Linux amd64 架构二进制
          curl -fsSL https://raw.githubusercontent.com/vernette/warpscout/master/install.sh | sh
          # 验证版本
          warpscout version

      - name: 注册 WARP 凭据
        run: |
          # 注册新的 WARP + MASQUE 设备
          warpscout register

      - name: 扫描 MASQUE-H2 端点
        run: |
          # -f 扫描全部端点，确保拿到足够多的候选池
          # 并输出报告和单一的模板配置
          warpscout scan -p masque-h2 -n 15 \
            -o scan-report.txt \
            -conf best-mihomo.yaml \
            -conf-type mihomo

      - name: 生成订阅配置文件
        run: |
          python generate_sub.py

      - name: 发布订阅到 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest WARP Subscription"
          body: |
            自动更新于: ${{ github.event.head_commit.timestamp || 'Manual Run' }}
            可直接在 Mihomo / Clash Verge Rev 中填入该订阅链接。
          files: warp.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
