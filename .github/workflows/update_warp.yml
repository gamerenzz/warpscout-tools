name: Auto Generate WARP Config

on:
  schedule:
    # 每天 UTC 时间 0点和12点运行一次 (对应北京时间 08:00 和 20:00)
    - cron: '0 0,12 * * *'
  workflow_dispatch: # 允许在 GitHub 网页上随时手动点击运行

# 关键：赋予工作流向仓库推代码（写权限）
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 安装 warpscout
        run: |
          curl -fsSL https://raw.githubusercontent.com/vernette/warpscout/master/install.sh | sh
          warpscout version

      - name: 注册 WARP 凭据
        run: |
          warpscout register

      - name: 扫描 MASQUE-H2 端点
        run: |
          # 扫描端点，结果在当前工作目录
          warpscout scan -p masque-h2 -n 20 \
            -o scan-report.txt \
            -conf best-mihomo.yaml \
            -conf-type mihomo

      - name: 生成订阅配置文件 (同级目录)
        run: |
          python generate_sub.py

      - name: 提交并推送到仓库
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # 只把生成的 warp.yaml 添加并提交，避免将账号隐私缓存/报告推上去
          git add warp.yaml
          
          # 检查是否有内容变更，有变更才 commit，避免报错
          if git diff --staged --quiet; then
            echo "配置无变化，无需提交。"
          else
            git commit -m "Auto update warp.yaml [skip ci]"
            git push
          fi
